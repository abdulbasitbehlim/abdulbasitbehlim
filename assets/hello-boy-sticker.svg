    <text x="510" y="205" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#17365d">Hello!</text>
    <path d="M626 122 l15 -22 M646 137 l24 -9" stroke="#f59e0b" stroke-width="10"/>

