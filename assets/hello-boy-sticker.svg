<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">Friendly hello sticker</title>
  <desc id="desc">A friendly young researcher waving hello while holding a laptop.</desc>
  <defs>
