    <path d="M177 106 C235 48 342 42 412 94 C453 86 511 99 548 132 C592 171 601 226 583 265 C626 282 650 321 648 363 C646 404 620 438 586 454 C604 497 592 548 559 580 C524 615 474 623 434 608 C404 649 354 671 304 662 C263 655 228 631 207 598 C164 608 113 589 85 554 C54 517 50 463 70 421 C34 392 20 344 35 300 C47 263 76 234 112 221 C101 178 122 135 177 106 Z" fill="#ffffff"/>

