      <path d="M56 75 C50 59 65 49 78 58 C89 49 104 58 99 75 C95 90 84 96 78 96 C70 96 61 89 56 75 Z" fill="#ffffff"/>
      <g transform="translate(142 70)" fill="none" stroke="#334155" stroke-width="5">
        <ellipse rx="27" ry="10"/><ellipse rx="27" ry="10" transform="rotate(60)"/><ellipse rx="27" ry="10" transform="rotate(120)"/><circle r="4" fill="#334155"/>
