    <path d="M278 393 C286 428 306 449 332 456 C360 450 381 429 389 394" fill="none" stroke="#dbeafe" stroke-width="8"/>
    <line x1="300" y1="417" x2="292" y2="493" stroke="#f8fafc" stroke-width="8"/>
    <line x1="376" y1="417" x2="384" y2="493" stroke="#f8fafc" stroke-width="8"/>

    <!-- neck -->
