    <!-- holding arm -->
    <path d="M421 517 C394 507 370 517 360 539 C350 562 369 586 398 589 L451 592 C470 592 482 575 476 558 C468 535 447 523 421 517 Z" fill="#ffc7a4" stroke="#111827" stroke-width="10"/>
