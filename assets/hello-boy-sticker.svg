    <ellipse cx="273" cy="242" rx="29" ry="35" fill="#ffffff" stroke="#111827" stroke-width="8"/>
    <ellipse cx="390" cy="242" rx="29" ry="35" fill="#ffffff" stroke="#111827" stroke-width="8"/>
    <circle cx="280" cy="250" r="14" fill="#5b371f"/>
    <circle cx="397" cy="250" r="14" fill="#5b371f"/>
    <circle cx="285" cy="245" r="5" fill="#ffffff"/>
    <circle cx="402" cy="245" r="5" fill="#ffffff"/>

