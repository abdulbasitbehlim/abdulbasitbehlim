<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-labelledby="t d">
<title id="t">Guide finder demo</title><desc id="d">An animated strip that scans a demo DNA sequence and highlights each 20-nucleotide guide next to an NGG PAM site.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060914"/><stop offset="1" stop-color="#0d1230"/></linearGradient>
