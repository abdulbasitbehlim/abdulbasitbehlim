<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><clipPath id="c"><rect width="1200" height="210" rx="20"/></clipPath></defs>
<style>@keyframes mv{0.00%,17.00%{transform:translateX(152.0px)}20.00%,37.00%{transform:translateX(304.0px)}40.00%,57.00%{transform:translateX(456.0px)}60.00%,77.00%{transform:translateX(577.6px)}80.00%,97.00%{transform:translateX(714.4px)}100%{transform:translateX(152.0px)}}.win{animation:mv 14.0s cubic-bezier(.6,0,.2,1) infinite}.m0{opacity:0;animation:m0 14.0s steps(1) infinite}@keyframes m0{0.00%{opacity:1}20.00%{opacity:0}}.m1{opacity:0;animation:m1 14.0s steps(1) infinite}@keyframes m1{20.00%{opacity:1}40.00%{opacity:0}}.m2{opacity:0;animation:m2 14.0s steps(1) infinite}@keyframes m2{40.00%{opacity:1}60.00%{opacity:0}}.m3{opacity:0;animation:m3 14.0s steps(1) infinite}@keyframes m3{60.00%{opacity:1}80.00%{opacity:0}}.m4{opacity:0;animation:m4 14.0s steps(1) infinite}@keyframes m4{80.00%{opacity:1}100.00%{opacity:0}}.scan{animation:sc 5.5s linear infinite}@keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.f0,.m0{opacity:1!important}}</style>
<g clip-path="url(#c)"><rect width="1200" height="210" fill="url(#bg)"/>
<rect width="1200" height="210" fill="#080d1e" fill-opacity=".55"/>
