  <g transform="translate(1130 0)">
    <!-- window -->
    <rect x="620" y="0" width="650" height="510" fill="#e0f2fe"/>
    <rect x="620" y="0" width="650" height="510" fill="#ffffff" opacity="0.1"/>
    <path d="M620 260 L760 175 L850 230 L960 135 L1080 225 L1270 160 V510 H620 Z" fill="url(#mountain)" opacity="0.72"/>
    <path d="M620 338 C760 300 830 350 960 310 C1080 275 1170 330 1270 300 V510 H620 Z" fill="#86efac" opacity="0.92"/>
    <rect x="620" y="0" width="12" height="510" fill="#475569"/><rect x="1258" y="0" width="12" height="510" fill="#475569"/>

    <!-- posters -->
    <g filter="url(#soft)">
      <rect x="30" y="40" width="220" height="260" rx="6" fill="#111827"/>
      <text x="60" y="200" font-family="Inter, Arial" font-size="26" fill="#fff">Small</text>
      <text x="60" y="235" font-family="Inter, Arial" font-size="26" fill="#fff">Genomes</text>
      <text x="60" y="270" font-family="Inter, Arial" font-size="26" fill="#fff">Big Impact</text>
      <path d="M80 80 C120 120 95 160 160 175 C200 185 180 220 210 235" stroke="#cbd5e1" stroke-width="3" fill="none"/>
      <rect x="275" y="40" width="220" height="260" rx="6" fill="#374151"/>
      <polygon points="385,80 420,100 420,140 385,160 350,140 350,100" fill="none" stroke="#f8fafc" stroke-width="4"/>
      <line x1="385" y1="160" x2="385" y2="225" stroke="#f8fafc" stroke-width="4"/>
      <line x1="385" y1="200" x2="350" y2="240" stroke="#f8fafc" stroke-width="4"/>
      <line x1="385" y1="200" x2="420" y2="240" stroke="#f8fafc" stroke-width="4"/>
      <text x="430" y="275" font-family="Inter, Arial" font-size="14" fill="#e5e7eb">100 nm</text>
      <rect x="520" y="40" width="230" height="260" rx="6" fill="#f8fafc"/>
      <text x="550" y="110" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#334155">Better</text>
      <text x="550" y="150" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#334155">Microbes</text>
      <text x="550" y="190" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#334155">A Healthier</text>
      <text x="550" y="230" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#334155">Tomorrow</text>
    </g>

    <!-- desk -->
    <polygon points="0,610 1270,505 1270,900 0,900" fill="url(#desk)"/>

    <!-- books left -->
    <g filter="url(#soft)">
      <rect x="50" y="500" width="350" height="52" rx="4" fill="#1e293b"/>
      <text x="75" y="534" font-family="Inter, Arial" font-size="22" fill="#f8fafc">Microbial Genomics</text>
      <rect x="35" y="554" width="380" height="56" rx="4" fill="#111827"/>
      <text x="62" y="589" font-family="Inter, Arial" font-size="22" fill="#f8fafc">Machine Learning</text>
      <rect x="25" y="612" width="400" height="58" rx="4" fill="#0f766e"/>
      <text x="54" y="649" font-family="Inter, Arial" font-size="22" fill="#ecfeff">Bioinformatics</text>
    </g>

    <!-- laptop -->
    <g transform="translate(380 365)" filter="url(#shadow)">
      <rect x="0" y="0" width="500" height="310" rx="18" fill="#1f2937"/>
      <rect x="18" y="18" width="464" height="270" rx="8" fill="url(#screen)"/>
      <!-- code -->
      <g stroke-linecap="round" stroke-width="6">
        <line x1="42" y1="62" x2="180" y2="62" stroke="#38bdf8"/><line x1="60" y1="88" x2="240" y2="88" stroke="#a78bfa"/>
        <line x1="42" y1="114" x2="205" y2="114" stroke="#34d399"/><line x1="78" y1="140" x2="260" y2="140" stroke="#fbbf24"/>
        <line x1="42" y1="166" x2="220" y2="166" stroke="#f472b6"/><line x1="60" y1="192" x2="255" y2="192" stroke="#60a5fa"/>
        <line x1="42" y1="218" x2="175" y2="218" stroke="#34d399"/><line x1="78" y1="244" x2="232" y2="244" stroke="#f59e0b"/>
      </g>
      <!-- protein network -->
      <g transform="translate(350 80)" fill="none" stroke-width="6">
        <path d="M0 40 C40 -15 90 15 70 60 C45 105 110 90 120 130 C130 170 70 180 50 145 C20 105 -20 120 0 40" stroke="#22d3ee"/>
        <path d="M25 20 C60 70 20 90 45 120 C70 150 105 125 95 80 C86 40 65 10 25 20" stroke="#a3e635"/>
        <path d="M75 15 C120 45 130 95 100 125" stroke="#fb923c"/>
      </g>
      <path d="M-45 310 H545 L630 380 H-130 Z" fill="#94a3b8"/>
      <rect x="150" y="330" width="200" height="22" rx="11" fill="#64748b"/>
    </g>

    <!-- plant -->
    <g transform="translate(910 260)">
      <rect x="40" y="205" width="130" height="135" rx="18" fill="#f8fafc" filter="url(#soft)"/>
      <g fill="#22c55e">
        <ellipse cx="95" cy="120" rx="34" ry="80" transform="rotate(-35 95 120)"/>
        <ellipse cx="145" cy="100" rx="30" ry="72" transform="rotate(28 145 100)"/>
        <ellipse cx="60" cy="95" rx="28" ry="66" transform="rotate(-58 60 95)"/>
        <ellipse cx="175" cy="155" rx="28" ry="62" transform="rotate(55 175 155)"/>
      </g>
      <g stroke="#15803d" stroke-width="4"><line x1="100" y1="235" x2="95" y2="100"/><line x1="110" y1="230" x2="145" y2="90"/><line x1="90" y1="230" x2="60" y2="100"/><line x1="120" y1="230" x2="175" y2="155"/></g>
    </g>

    <!-- right books -->
    <g transform="translate(930 580)" filter="url(#soft)" font-family="Inter, Arial" font-size="19">
      <rect x="0" y="0" width="320" height="48" rx="4" fill="#1e3a8a"/><text x="20" y="31" fill="#fff">Python for Data Analysis</text>
      <rect x="12" y="50" width="308" height="48" rx="4" fill="#111827"/><text x="30" y="82" fill="#fff">Machine Learning</text>
      <rect x="2" y="100" width="318" height="48" rx="4" fill="#334155"/><text x="20" y="132" fill="#fff">Biological Data Science</text>
      <rect x="14" y="150" width="306" height="48" rx="4" fill="#172554"/><text x="32" y="182" fill="#fff">Applied Bioinformatics</text>
    </g>

    <!-- notebook -->
    <g transform="translate(220 700) rotate(-4)" filter="url(#soft)">
      <rect x="0" y="0" width="400" height="145" rx="10" fill="#fffdf5"/>
      <line x1="200" y1="8" x2="200" y2="136" stroke="#cbd5e1" stroke-width="2"/>
      <text x="32" y="36" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#475569">Ideas:</text>
      <text x="32" y="68" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#64748b">Better algorithms</text>
      <text x="230" y="36" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#475569">Next Steps:</text>
      <text x="230" y="68" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#64748b">Analyse · Build · Validate</text>
    </g>
  </g>

  <rect x="0" y="0" width="2400" height="900" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
</svg>