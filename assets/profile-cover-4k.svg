<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1440" viewBox="0 0 2400 900" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Basit Behlim - Computational Biology profile cover</title>
  <desc id="desc">Professional vector banner combining computational biology, bioinformatics, machine learning and a modern scientific workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef6f6"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#7c4a2d"/>
      <stop offset="0.5" stop-color="#9a5f37"/>
      <stop offset="1" stop-color="#6b3f28"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="2400" height="900" fill="url(#bg)"/>
  <circle cx="2230" cy="90" r="250" fill="#ffffff" opacity="0.42"/>
  <circle cx="2100" cy="180" r="180" fill="#bfdbfe" opacity="0.22"/>

  <!-- Left content panel -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#0f2747">
    <text x="74" y="96" font-size="30" font-style="italic" fill="#334155">“Using data and biology</text>
    <text x="74" y="132" font-size="30" font-style="italic" fill="#334155">to solve real world problems”</text>
    <line x1="74" y1="158" x2="500" y2="158" stroke="#94a3b8" stroke-width="2"/>

    <text x="72" y="250" font-size="72" font-weight="800" letter-spacing="-1">Abdul Basit Behlim</text>
    <text x="74" y="305" font-size="32" font-weight="500" fill="#1e3a5f">Data Scientist | Computational Biology | Bioinformatics</text>

    <text x="74" y="385" font-size="25" fill="#334155">Applying machine learning and computational approaches</text>
    <text x="74" y="423" font-size="25" fill="#334155">to understand biological systems and develop practical solutions</text>
    <text x="74" y="461" font-size="25" fill="#334155">in microbial genomics and biotechnology.</text>
  </g>

  <!-- Topic icons -->
  <g transform="translate(88 548)" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#0f2747">
    <g transform="translate(0 0)">
      <path d="M0 0 C30 18 30 54 0 72 M34 0 C4 18 4 54 34 72 M5 12 H29 M5 60 H29 M9 30 H25 M9 42 H25" fill="none" stroke="#0f2747" stroke-width="4"/>
      <text x="17" y="112" font-size="18">Genomics</text>
    </g>
    <g transform="translate(150 0)">
      <polygon points="17,0 35,10 35,30 17,40 0,30 0,10" fill="none" stroke="#0f2747" stroke-width="4"/>
      <line x1="17" y1="40" x2="17" y2="70" stroke="#0f2747" stroke-width="4"/>
      <line x1="17" y1="58" x2="0" y2="78" stroke="#0f2747" stroke-width="4"/>
      <line x1="17" y1="58" x2="34" y2="78" stroke="#0f2747" stroke-width="4"/>
      <text x="17" y="112" font-size="18">Phage Biology</text>
    </g>
    <g transform="translate(315 0)">
      <rect x="0" y="38" width="10" height="38" rx="2"/><rect x="17" y="26" width="10" height="50" rx="2"/><rect x="34" y="10" width="10" height="66" rx="2"/>
      <text x="22" y="112" font-size="18">Machine Learning</text>
    </g>
    <g transform="translate(490 0)">
      <ellipse cx="22" cy="12" rx="22" ry="9" fill="none" stroke="#0f2747" stroke-width="4"/>
      <path d="M0 12 V62 C0 74 44 74 44 62 V12 M0 36 C0 48 44 48 44 36" fill="none" stroke="#0f2747" stroke-width="4"/>
      <text x="22" y="112" font-size="18">Bioinformatics</text>
    </g>
    <g transform="translate(660 0)">
      <circle cx="24" cy="38" r="18" fill="none" stroke="#0f2747" stroke-width="4"/>
      <circle cx="24" cy="38" r="5"/>
      <path d="M24 6 V17 M24 59 V70 M-8 38 H3 M45 38 H56 M2 16 L10 24 M38 52 L46 60 M46 16 L38 24 M10 52 L2 60" stroke="#0f2747" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="104" font-size="18">Computational</text><text x="24" y="128" font-size="18">Modelling</text>
    </g>
    <g transform="translate(835 0)">
      <path d="M22 4 C-2 4 -8 36 8 50 C14 56 15 62 15 68 H29 C29 62 30 56 36 50 C52 36 46 4 22 4 Z" fill="none" stroke="#0f2747" stroke-width="4"/>
      <line x1="14" y1="74" x2="30" y2="74" stroke="#0f2747" stroke-width="4"/>
      <text x="22" y="104" font-size="18">Real-world</text><text x="22" y="128" font-size="18">Applications</text>
    </g>
  </g>

  <line x1="72" y1="740" x2="640" y2="740" stroke="#94a3b8" stroke-width="2"/>
  <text x="74" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="5" fill="#334155">LEARN  |  ANALYSE  |  BUILD  |  CONTRIBUTE</text>

